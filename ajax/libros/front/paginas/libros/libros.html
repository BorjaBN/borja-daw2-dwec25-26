<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Libros</title>

    <!-- Hojas de estilos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Dependencias JavaScript-->
    <script src="https://code.jquery.com/jquery-3.7.1.js"
			integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4="
			crossorigin="anonymous" defer>
    </script>

    <!-- Dependencias relacionadas con bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/json2html/3.3.3/json2html.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.json2html/1.2.0/jquery.json2html.js" defer></script>

    <!-- Carga los parámetros de configuración -->
    <script src="../../js/environment.js" defer></script>
    <script src="../../js/app.js" defer></script>

    <script type="module" src="libros.mjs"></script>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container-fluid">

            <a class="navbar-brand" href="../libros/libros.html">Biblioteca</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuPrincipal">

                <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                    <li class="nav-item">
                        <a class="nav-link active" href="../libros/libros.html">Gestión de libros</a>
                    </li>
                    
                    <li class="nav-item">
                        <a class="nav-link active" href="../listados/listado_alfabetico.html">Listado alfabético</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="../listados/listado_tipos.html">Listado por campo</a>
                    </li>

                </ul>

                <button id="btnCerrarSesion" class="btn btn-danger">Cerrar sesión</button>

            </div>
        </div>
    </nav>



    <div class="container-fluid m-3">
        <div class="row justify-content-between">

            <!-- Buscador -->
            <div id="buscador" class="col"></div>

            <!-- Botón añadir -->
            <div class="col-1 text-right">
                <button id="btAnadir" type="button" class="btn btn-success rounded-circle">
                    <i class="bi bi-bookmark-plus"></i>
                </button>
            </div>
        </div>
    </div>

    <table class="table table-striped table-hover">
        <thead>
            <tr>
                <th class="d-flex align-items-center gap-1">
                    <div class="d-flex align-items-center justify-content-center gap-1">
                        <span>Título</span>
                        <button id="ordenTituloAsc" class="btn btn-sm btn-light bi bi-arrow-up" title="Orden ascendente"></button>
                        <button id="ordenTituloDesc" class="btn btn-sm btn-light bi bi-arrow-down" title="Orden descendente"></button>
                    </div>
                </th>

                <th>Autor</th>
                <th>Editorial</th>
                <th>Año</th>
                <th>Edición</th>
            </tr>
        </thead>

        <tbody id="libros">
            <!-- Aquí nuestro código va a insertar los libros -->
        </tbody>
    </table>

    <!-- Separador. Lo pongo para que la página quede mejor cuando no hay datos. -->
    <hr class="mt-2 mb-2 text-secondary" />
    <!-- Espacio para colocar el paginador -->
    <div id="paginador"></div>

</body>
</html>
