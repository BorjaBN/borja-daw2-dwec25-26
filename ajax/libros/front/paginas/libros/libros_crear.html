<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Libro</title>

    <!-- Hojas de estilos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Dependencias JavaScript-->
    <script src="https://code.jquery.com/jquery-3.7.1.js"
			integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4="
			crossorigin="anonymous" defer>
    </script>

    <!-- Dependencias relacionadas con bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/json2html/3.3.3/json2html.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.json2html/1.2.0/jquery.json2html.js" defer></script>

    <!-- Carga los parámetros de configuración -->
    <script src="../../js/environment.js" defer></script>
    <script src="../../js/app.js" defer></script>

    <script type="module" src="libros_crear.mjs"></script>    

    <link rel="stylesheet" href="../../css/app.css">
</head>

<body>

    <h1>Crear Libro</h1>

    <div id="libros_edit">

        <form id="formularioLibros" action="#">

            <input name="titulo" placeholder="Título" class="form-control"
                data-validacion="vacio,nombre"
                data-ayuda="Introduce un título válido" /><br>
            <div id="titulo-ayuda"></div>

            <input name="autor" placeholder="Autor" class="form-control"
                data-validacion="vacio,nombre"
                data-ayuda="Introduce un autor válido" /><br>
            <div id="autor-ayuda"></div>

            <input name="editorial" placeholder="Editorial" class="form-control"
                data-validacion="vacio,nombre"
                data-ayuda="Introduce una editorial válida" /><br>
            <div id="editorial-ayuda"></div>

            <input name="anho_publicacion" placeholder="Año de publicación" class="form-control"
                data-validacion="vacio,anho"
                data-ayuda="Introduce un año válido" /><br>
            <div id="anho_publicacion-ayuda"></div>

            <input name="num_edicion" placeholder="Número de edición" class="form-control"
                data-validacion="vacio,edicion"
                data-ayuda="Introduce un número de edición válido" /><br>
            <div id="num_edicion-ayuda"></div>

            <button id="btnVolver" type="button" class="btn btn-primary">Volver</button>
            <button id="btnGuardar" type="submit" class="btn btn-success">Guardar</button>

            <div id="ayuda"></div>
        </form>
    </div>

</body>
</html>
