<div class="container-fluid">

  <h3 class="mb-3">Listado por campo</h3>

  <!-- Selector de columnas -->
  <div class="mb-3">
    <label class="form-label fw-bold">Selecciona las columnas a mostrar:</label>

    <div class="d-flex flex-wrap gap-3">
      <div *ngFor="let campo of camposDisponibles">
        <input 
          type="checkbox" 
          [value]="campo.key"
          [(ngModel)]="campo.seleccionado"
          (change)="actualizarColumnas()"
        >
        {{ campo.label }}
      </div>
    </div>
  </div>

  <!-- Tabla -->
  <table class="table table-striped table-hover">
    <thead>
      <tr>
        <th *ngFor="let col of columnasVisibles">{{ col.label }}</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let libro of librosPaginados">
        <td *ngFor="let col of columnasVisibles">
          {{ libro[col.key] }}
        </td>
      </tr>
    </tbody>
  </table>

  <!-- Paginación -->
  <nav class="mt-3">
    <ul class="pagination justify-content-center">

      <li class="page-item" [class.disabled]="paginaActual === 1">
        <button class="page-link" (click)="paginaAnterior()">Anterior</button>
      </li>

      <li class="page-item disabled">
        <span class="page-link">
          Página {{ paginaActual }}
        </span>
      </li>

      <li class="page-item">
        <button class="page-link" (click)="paginaSiguiente()">Siguiente</button>
      </li>

    </ul>
  </nav>

</div>
