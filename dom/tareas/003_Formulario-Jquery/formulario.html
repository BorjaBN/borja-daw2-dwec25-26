<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Jquery de prueba</title>
    <link rel="stylesheet" href="formulario.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script type="module" src="formulario.mjs" defer></script>
</head>

<body>
    <header></header>

    <main>
        <form id="formulario" class="formulario">

            <fieldset>
                <label for="nombre">Nombre: </label>
                <input type="text" id="nombre"
                    data-ayuda="Introduce un nombre válido"
                    data-validacion="vacio,nombre,longitudNombre"
                    name="nombre"
                >
                <br><br>
                <label for="apellidos">Apellidos: </label>
                <input type="text" id="apellidos"
                    data-ayuda="Introduce apellidos válidos"
                    data-validacion="vacio,nombre"
                    name="apellidos"
                >
                <br><br>
                <label for="dni">DNI: </label>
                <input type="text" id="dni"
                    data-ayuda="Introduce un DNI válido"
                    data-validacion="dni,vacio"
                    name="dni"
                >
                <br><br>

            </fieldset>
            <br><br>
            <fieldset>
                <label for="email">Email: </label>
                <input type="email" id="email"
                    data-ayuda="Introduce un email válido"
                    data-validacion="vacio,email"
                    name="email"
                >
                <br><br>

                <label for="contrasenha1">Contraseña 1: </label>
                <input type="password" id="contrasenha1"
                    data-ayuda="Introduce una contraseña"
                    data-validacion="vacio"
                    name="contrasenha1"
                >
                <br><br>
                <label for="contrasenha2">Contraseña 2: </label>
                <input type="password" id="contrasenha2"
                    data-ayuda="Repite la contraseña"
                    data-validacion="vacio"
                    name="contrasenha2"
                >
            </fieldset>

            <br>

            <input type="submit" value="Aceptar">
            <input type="reset" value="Limpiar">

        </form>

        <div id="ayuda">
            Texto de ayuda
        </div>
    </main>

    <footer></footer>
</body>
</html>
